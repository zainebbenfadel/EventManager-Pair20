name: Event Manager CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest

  # NEW: Terraform lint + security scan (GitHub cloud)
  lint-and-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
        env:
          TF_VAR_docker_username: dummy
          TF_VAR_laptop_a_ip: 127.0.0.1
      - run: terraform validate
        env:
          TF_VAR_docker_username: dummy
          TF_VAR_laptop_a_ip: 127.0.0.1
      - uses: aquasecurity/tfsec-action@v1.0.3

  build-and-push-backend:
    needs: [test, lint-and-sec]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/eventmanager-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/eventmanager-backend:${{ github.sha }}

  build-and-push-frontend:
    needs: [test, lint-and-sec]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/eventmanager-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/eventmanager-frontend:${{ github.sha }}

  # Runs on Laptop A
  deploy-backend:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: [self-hosted, backend-server]
    if: github.ref == 'refs/heads/main'
    env:
      TF_VAR_docker_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      TF_VAR_laptop_a_ip: ${{ vars.LAPTOP_A_IP }}
    steps:
      - uses: actions/checkout@v4
      - run: terraform init
      - run: terraform apply -auto-approve -target=module.backend

  # Runs on Laptop B
  deploy-frontend:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: [self-hosted, frontend-server]
    if: github.ref == 'refs/heads/main'
    env:
      TF_VAR_docker_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      TF_VAR_laptop_a_ip: ${{ vars.LAPTOP_A_IP }}
    steps:
      - uses: actions/checkout@v4
      - run: terraform init
      - run: terraform apply -auto-approve -target=module.frontend